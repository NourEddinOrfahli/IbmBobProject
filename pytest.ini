[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Exclude live (real-network) tests by default — run them explicitly with:
#   pytest -m live
# This matches the documented behaviour: "Live tests (real network, skipped by default)"
addopts = -m "not live"
markers =
    live: marks tests that make real network calls to NASA or OpenRouter APIs (deselect with -m "not live")
